  - name: 📖 常见问题 FAQ
    url: https://github.com/MapleYazuu/Screenshot-AI/blob/main/README.md
    about: 见 README 的「常见问题 FAQ」章节：悬浮球不见、截图失败、401/429 报错、后台被杀等。
  - name: 🔑 BYOK 与 API Key 配置
    url: https://github.com/MapleYazuu/Screenshot-AI/blob/main/docs/byok.md
    about: Key 申请地址、额度说明、错误码对照与成本控制建议。
  - name: 🔒 API Key 安全策略
    url: https://github.com/MapleYazuu/Screenshot-AI/blob/main/docs/api-key-security.md
